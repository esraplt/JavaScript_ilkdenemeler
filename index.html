<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JavaScript Denemesi</title>
</head>
<body>

    <script>
      alert("Sitemize hoş geldiniz!");
      let devam = confirm("Devam etmek istiyor musunuz?");
      if (devam) {
        alert("Devam ediliyor...");
      } else {
        alert("İşlem iptal edildi.");
      }
      let ad = prompt("Lütfen adınızı giriniz:");
      if (ad != null && ad != "") {
        alert("Merhaba, " + ad + "!");
      }
    </script>

</body>
</html>
